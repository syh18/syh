<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitchen Display — CafePOS</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><header><div><span class="eyebrow">KITCHEN DISPLAY SYSTEM</span><h1>Kitchen / Bar</h1><p>Pesanan QR customer.</p></div><button class="primary small" onclick="render()">Refresh</button></header><div id="tickets" class="product-grid"></div></div><script>function render(){const q=JSON.parse(localStorage.getItem("cafe_qr_orders")||"[]");tickets.innerHTML=q.map((o,i)=>'<div class="panel"><span class="status">'+o.status+'</span><h2 style="margin-top:12px">'+o.id+'</h2><p>'+o.time+'</p><hr>'+o.items.map(x=>'<p style="padding:7px 0"><b>'+x.qty+'×</b> '+x.name+'</p>').join("")+(o.note?'<p><b>Catatan:</b> '+o.note+'</p>':'')+'<button class="primary" style="width:100%;margin-top:14px" onclick="done('+i+')">Tandai Selesai</button></div>').join("")||'<div class="panel"><p>Tidak ada pesanan QR.</p></div>'}function done(i){const q=JSON.parse(localStorage.getItem("cafe_qr_orders")||"[]");q[i].status="Selesai";localStorage.setItem("cafe_qr_orders",JSON.stringify(q));render()}render();setInterval(render,5000)</script></body></html>
