<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order — Kopi Senja</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><header><div><span class="eyebrow">SCAN • ORDER • ENJOY</span><h1>Kopi Senja Cafe</h1><p>Order langsung dari meja kamu.</p></div></header><main><div class="section-head"><div><h2>Menu</h2><p>Pilih makanan dan minuman.</p></div></div><div id="products" class="product-grid"></div><div class="panel" style="margin-top:20px"><h2>Keranjang</h2><div id="cart"></div><div class="summary"><div class="total"><span>Total</span><strong id="total">Rp0</strong></div></div><label>Catatan pesanan<input id="note" placeholder="Contoh: less ice"></label><button class="primary" style="width:100%;margin-top:12px" onclick="send()">Kirim Pesanan</button></div></main></div><script>const P=[["Kopi Susu Gula Aren",22000,"☕"],["Americano",18000,"☕"],["Matcha Latte",26000,"🍵"],["Lychee Tea",18000,"🧋"],["French Fries",20000,"🍟"],["Chicken Rice Bowl",32000,"🍚"]];let c=[];const m=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n);function r(){products.innerHTML=P.map((p,i)=>'<button class="product" onclick="a('+i+')"><span class="emoji">'+p[2]+'</span><h3>'+p[0]+'</h3><div class="price">'+m(p[1])+'</div></button>').join("");cart.innerHTML=c.map((x,i)=>'<div class="cart-row"><div><b>'+x[0]+'</b><br><small>'+m(x[1])+'</small></div><div class="qty"><button onclick="q('+i+',-1)">−</button><b>'+x[2]+'</b><button onclick="q('+i+',1)">+</button></div></div>').join("")||"<p>Keranjang masih kosong.</p>";total.textContent=m(c.reduce((s,x)=>s+x[1]*x[2],0))}function a(i){let x=c.find(x=>x[0]===P[i][0]);x?x[2]++:c.push([P[i][0],P[i][1],1]);r()}function q(i,d){c[i][2]+=d;if(c[i][2]<=0)c.splice(i,1);r()}function send(){if(!c.length)return alert("Pilih menu dulu.");const o={id:"QR-"+Date.now().toString().slice(-6),source:"QR Customer",items:c.map(x=>({name:x[0],qty:x[2],price:x[1]})),note:note.value,status:"Menunggu",time:new Date().toLocaleString("id-ID")};const q=JSON.parse(localStorage.getItem("cafe_qr_orders")||"[]");q.unshift(o);localStorage.setItem("cafe_qr_orders",JSON.stringify(q));c=[];r();alert("Pesanan terkirim. No: "+o.id)}r();</script></body></html>
